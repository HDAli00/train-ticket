# Local docker-compose deployment of train-ticket 1.0 (all services).
# GENERATED from deployment/kubernetes-manifests/quickstart-k8s/yamls/deploy.yaml.sample
# by hack/gen-local-compose.py -- edit that script, not this file.
# Usage: see deployment/docker-compose-manifests/local/README.md (use up.sh, not a bare 'up').
name: train-ticket
services:
  ts-mysql:
    image: mysql:5.7
    command:
    - --max_connections=1000
    - --character-set-server=utf8
    - --collation-server=utf8_general_ci
    environment:
      MYSQL_ROOT_PASSWORD: Ts_123456
      MYSQL_DATABASE: ts
      MYSQL_USER: ts
      MYSQL_PASSWORD: Ts_123456
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped
    networks:
    - trainticket
  nacos:
    image: nacos/nacos-server:v2.1.0
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: 'false'
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
    - 8848:8848
    healthcheck:
      test:
      - CMD-SHELL
      - curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    networks:
    - trainticket
  rabbitmq:
    image: rabbitmq:3.10
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    networks:
    - trainticket
  ts-admin-basic-info-service:
    image: codewisdom/ts-admin-basic-info-service:1.0.0
    restart: unless-stopped
    mem_limit: 700m
    networks:
    - trainticket
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c "exec 3<>/dev/tcp/127.0.0.1/18767" || exit 1
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    environment:
      NACOS_ADDRS: nacos:8848
    depends_on:
      nacos:
        condition: service_healthy
  ts-admin-order-service:
